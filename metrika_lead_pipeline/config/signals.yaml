version: "2.0"
signals:
  - id: comparison
    name: "сравнение моделей"
    confidence: 0.8
    all_patterns: ["(?i)(?:сравнение|vs|или|против|что выбрать|лучше|альтернатива)"]
    min_model_mentions: 2
    explanation: "Choice-сигнал: страница сравнивает альтернативы или помогает выбрать между моделями."

  - id: prices
    name: "цены"
    confidence: 0.85
    any_patterns: ["(?i)(?:цена|стоимость|сколько стоит|прайс|скидк|кредит|наличи)"]
    explanation: "Purchase-сигнал: обнаружены слова про цену, стоимость, наличие, скидку или условия покупки."

  - id: trims
    name: "комплектации"
    confidence: 0.8
    any_patterns: ["(?i)(?:комплектац|версия|оснащение)"]
    explanation: "Purchase-сигнал: обнаружены слова про комплектации, версии или оснащение."

  - id: dealers
    name: "дилеры"
    confidence: 0.8
    any_patterns: ["(?i)(?:где купить|дилер|салон|предложение)"]
    explanation: "Purchase-сигнал: обнаружены слова про дилеров, салоны или коммерческое предложение."

  - id: test_drive
    name: "тест-драйв"
    confidence: 0.9
    any_patterns: ["(?i)(?:тест[ -]?драйв)"]
    explanation: "Purchase-сигнал: обнаружено словосочетание тест-драйв."

  - id: category_budget
    name: "категория/бюджет"
    confidence: 0.75
    any_patterns: ["(?i)(?:кроссовер|седан|семейный|для города|до \\d+ млн|бюджет|рейтинг|подборка|лучшие)"]
    explanation: "Choice-сигнал: пользователь может выбирать класс, бюджет или подборку автомобилей."

  - id: risk_ownership
    name: "risk/ownership"
    confidence: 0.9
    any_patterns: ["(?i)(?:поломк|надежн|надёжн|расход|стоимость владения|пробег|отзыв владельц|ремонт|слабые места|гаранти|б/у|бу|подержан)"]
    explanation: "Risk/ownership-сигнал: материал связан с тревогой, проверкой риска, владением, ремонтом или б/у."

  - id: safety_recall
    name: "отзывная кампания по безопасности"
    confidence: 0.9
    any_patterns: ["(?i)(?:отзывн.*кампан|отзывают|дефект|неисправност|безопасност)"]
    explanation: "Form-prohibited сигнал: контекст безопасности или отзывной кампании требует запрета формы."

  - id: accident_incident
    name: "аварии и происшествия"
    confidence: 0.9
    any_patterns: ["(?i)(?:дтп|авари|происшеств|погиб|пострадал|трагед)"]
    explanation: "Form-prohibited сигнал: аварии, происшествия и трагические инфоповоды не должны получать коммерческую форму."

  - id: cold_news
    name: "новость"
    confidence: 0.7
    any_patterns: ["(?i)(?:представили|анонсировали|показали|премьера|продажи|рынок|статистика|закон|регуляторн|инфоповод)"]
    explanation: "Cold-news-сигнал: новостной или информационный контекст требует no action, bridge или ручной проверки."
